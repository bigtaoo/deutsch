name: CI

# 个人小项目，单一 workspace，没有 funny 那种 monorepo 的 docs-check/e2e/docker 分层——
# 一个 job 把 typecheck + 单测 + 生产构建都跑完就够了。
#
# 例外是 server/（同步后端）：它有自己的 node_modules、自己的 vitest 配置，
# 而且**根目录的 test:run 明确排掉了它**（在 jsdom 里跑 jose 会假红）。
# 所以它必须单独一个 job，否则后端代码改了 CI 一声不吭。
# 这个 job 绿了之后 deploy.yml 的 deploy-server 才会把它发到 VPS 上（见 deploy/README.md §6）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的旧 run 自动取消，省 runner 分钟数。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test:run

      - name: build
        run: npm run build

  server:
    name: sync backend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 后端在生产里靠 Node 内建的类型擦除直接跑 .ts，需要 24+。
          # 这里对齐生产，别用 22 —— 测试过了但线上起不来是最难查的一类。
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install
        # `--omit=optional` 跳过 onnxruntime-node（283MB，四个平台的预编译产物都在里面）。
        # CI 里用不上它：typecheck 只看类型，而对齐的单测喂的是假 engine ——
        # 真模型要 230MB 权重和 ffmpeg，那是部署验收（deploy/README.md §对齐）。
        # 镜像里当然要装，Dockerfile 那条 `npm ci` 没有这个开关。
        run: npm --prefix server ci --omit=optional

      - name: typecheck
        run: npm --prefix server run typecheck

      - name: test
        run: npm --prefix server test
