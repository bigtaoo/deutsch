name: CI

# 三个 job，各自守一件别人守不了的事：
#
#   build-and-test  前端的 typecheck + 单测 + 生产构建。
#   server          同步后端。它有自己的 node_modules、自己的 vitest 配置，而且
#                   **根目录的 test:run 明确排掉了它**（在 jsdom 里跑 jose 会假红），
#                   所以必须单独一个 job，否则后端代码改了 CI 一声不吭。
#                   这个 job 绿了之后 deploy.yml 的 deploy-server 才会把它发到 VPS 上
#                   （见 deploy/README.md §6）。
#   e2e             真 Chromium 跑构建产物。它守的是前面两个都守不住的一类事故：
#                   **类型过了、单测过了、构建也过了，但打开是白屏**。
#                   单测跑在 jsdom 里，那里没有真实的 IndexedDB 持久化、没有音频解码、
#                   没有 <input type=file>、也没有「刷新页面」这回事 ——
#                   而「关掉再打开，东西还在」正是这个应用最基本的承诺。
#
# 三个都是部署门禁：push main 就是上线（deploy 发 Cloudflare、deploy-server 发 VPS），
# 所以红了就不该发出去。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的旧 run 自动取消，省 runner 分钟数。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # onnxruntime-node（@huggingface/transformers 带进来的）的 postinstall 在 linux x64 上会去
      # NuGet 下 CUDA EP —— 这里只用 CPU（随包自带），下了也用不上，却让安装看微软服务器的
      # 脸色：2026-09-23 deploy 就因为连 150.171.110.152:443 ETIMEDOUT 红过一次。
      # server/Dockerfile 早就用 --ignore-scripts 跳过了同一件事。
      - name: install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test:run

      - name: build
        run: npm run build

  server:
    name: sync backend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 后端在生产里靠 Node 内建的类型擦除直接跑 .ts，需要 24+。
          # 这里对齐生产，别用 22 —— 测试过了但线上起不来是最难查的一类。
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install
        # **不要加 `--omit=optional`。** 试过，CI 当场红：TypeScript 7 把编译器本体
        # 按平台拆成了 optionalDependencies（`@typescript/typescript-linux-x64`），
        # 跳过 optional 之后 `tsc` 第一行就抛「Unable to resolve」。
        # 那个 flag 本来是想省掉 onnxruntime-node 的 283MB（CI 用不上它：
        # 对齐的单测喂的是假 engine），但 npm 只有全局开关，省不了那一个包。
        # 省不了包，但能省掉它 postinstall 去 NuGet 下 CUDA EP 那一趟（见前端 job 的 install）。
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm --prefix server ci

      - name: typecheck
        run: npm --prefix server run typecheck

      - name: test
        run: npm --prefix server test

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # onnxruntime-node（@huggingface/transformers 带进来的）的 postinstall 在 linux x64 上会去
      # NuGet 下 CUDA EP —— 这里只用 CPU（随包自带），下了也用不上，却让安装看微软服务器的
      # 脸色：2026-09-23 deploy 就因为连 150.171.110.152:443 ETIMEDOUT 红过一次。
      # server/Dockerfile 早就用 --ignore-scripts 跳过了同一件事。
      - name: install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      # 只装 chromium。真实运行环境是桌面 Chrome 与 iOS 的 WKWebView，
      # 而 CI 上的 Linux WebKit 与真机 Safari 不是一回事 —— 装它换来的绿灯是虚假的。
      # `--with-deps` 是必需的：ubuntu runner 上缺一堆 chromium 的系统库。
      - name: install chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 里的 webServer 会自己 `vite build` 再 `vite preview`，
      # 所以这里不用先构建一次。
      - name: e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        # 只在红的时候留：trace + 截图，本地 `npx playwright show-trace` 直接看回放。
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
